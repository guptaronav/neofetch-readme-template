# ─────────────────────────────────────────────────────────────────
# Neofetch Profile README — your config
# ─────────────────────────────────────────────────────────────────
# 1. Edit this file with your info
# 2. (Optional) Drop portrait.png or portrait.jpg in this folder
# 3. Run `python build.py`  →  light_mode.svg + dark_mode.svg
# That's the whole thing. No other code to touch.
# ─────────────────────────────────────────────────────────────────

# Top header — renders as "user@host ─────────────────"
user: yourname
host: github

# Uptime counter — shows "X years, Y months" since your birthday.
# Store the date as a repo secret, NOT here (keep it out of your public repo):
#   Settings → Secrets and variables → Actions → New repository secret
#   Name: BIRTHDAY   Value: YYYY-MM-DD
# Leave null (or omit entirely) to hide the Uptime line.
birthday: null

# ─────────────────────────────────────────────────────────────────
# Sections
# ─────────────────────────────────────────────────────────────────
# Each section is a group of "Key: Value" lines.
#   title: ""         →  no divider header (plain group)
#   title: "Contact"  →  renders "- Contact ─────────"
#
# Compound keys like "Languages.Programming" render both halves
# in the accent color: Languages.Programming: Python, Go
#
# Add, remove, or reorder anything — layout adjusts automatically.

sections:
  - title: ""
    items:
      - "OS: macOS, iOS, Windows 11"
      - "Host: Your School / Company"
      - "Kernel: Student / Engineer / Designer"
      - "IDE: VS Code"
      - "Shell: zsh"

  - title: ""
    items:
      - "Languages.Programming: Python, TypeScript"
      - "Languages.Computer: HTML, CSS, JSON, YAML"
      - "Languages.Real: English, Spanish"

  - title: ""
    items:
      - "Hobbies.Software: Game Dev, Open Source"
      - "Hobbies.Hardware: 3D Printing"

  - title: "Contact"
    items:
      - "Email: you@example.com"
      - "Discord: yourhandle"
      - "Website: example.com"
